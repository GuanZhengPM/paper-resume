<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>纸页简历</title><link rel="stylesheet" href="resume.css"><link rel="stylesheet" href="styles.css"><script src="vendor/marked.js" defer></script><script src="text-style.js" defer></script><script src="resume-structure.js" defer></script><script src="template-profiles.js" defer></script><script src="resume-core.js?v=20261004-11" defer></script><script src="resume-renderer.js" defer></script><script src="document-sync.js?v=20261004-11" defer></script><script src="image-drag.js" defer></script><script src="app.js?v=20261004-11" defer></script></head><body>
<header class="topbar"><button id="sidebar-toggle" class="icon-button" aria-label="我的简历" aria-expanded="false">☰</button><span id="home-button" class="brand"><img class="brand-logo" src="templates/portrait.png" alt="" aria-hidden="true">纸页简历</span><button id="document-name" title="重命名简历" hidden></button><div class="top-actions" id="editor-actions" hidden><span id="save-status" role="status"></span><button id="layout-toggle">样式设置</button><button id="smart-layout">一键排版</button><button id="pdf-download" class="primary">导出 PDF</button></div></header>
<aside id="sidebar" hidden><div class="sidebar-heading">我的简历<button id="sidebar-close" aria-label="收起侧栏">×</button></div><button id="new-resume" class="new-button">＋ 新建简历</button><div id="resume-list"></div></aside>
<main id="home-view"><div class="home-heading"><h1>从模板开始</h1><p>选择模板，上传简历后自动整理内容与排版</p></div><div id="template-gallery" class="template-gallery"></div></main>
<main id="edit-view" hidden><section class="editor-panel"><div class="editor-heading"><span></span><div class="format-actions"><button data-format="bold" title="加粗所选文字" aria-label="加粗"><b>B</b></button><button data-format="italic" title="斜体所选文字" aria-label="斜体"><i>I</i></button><button data-format="underline" title="下划线所选文字" aria-label="下划线"><u>U</u></button><button id="link-open" title="插入超链接" aria-label="超链接">链接</button><button id="image-open" title="插入照片或标志">图片</button></div></div><textarea id="editor" aria-label="简历 Markdown" spellcheck="false"></textarea></section><section class="preview-panel"><div class="preview-heading"><span>预览</span><div><span id="preview-status" role="status"></span><button id="image-reset-position" hidden>恢复自动位置</button><button id="fit-one" hidden>压成一页</button></div></div><div id="pdf-pages" class="pdf-pages"></div></section></main>
<aside id="layout-panel" hidden><div class="sidebar-heading">样式设置<button id="layout-close" aria-label="关闭样式设置">×</button></div><label>模板<select id="template-select"><option value="">自定义</option><option value="projects">工作与项目</option><option value="internship">实习与校园</option><option value="academic">科研与论文（英文）</option><option value="research">科研与论文（中文）</option><option value="bilingual">中英双语</option></select></label><label>字体<select data-setting="fontFamily"><option value="serif">思源宋体</option><option value="sans">思源黑体</option><option value="yahei">微软雅黑</option><option value="times">Times New Roman</option><option value="arial">Arial</option><option value="calibri">Calibri</option><option value="simsun">宋体</option><option value="kaiti">楷体</option><option value="fangsong">仿宋</option><option value="custom">本地字体…</option></select></label><label id="custom-font-field" hidden>本地字体<input id="custom-font-name" maxlength="80" placeholder="例如 Segoe UI"></label><label>字号<input data-setting="fontSize" type="number" min="8" max="36" step="any"></label><label>行距<input data-setting="lineHeight" type="number" min="1" max="2" step="0.05"></label><div class="margin-fields"><label>上边距<input data-setting="marginTop" type="number" min="6" max="30" step="1"></label><label>下边距<input data-setting="marginBottom" type="number" min="6" max="30" step="1"></label><label>左右边距<input data-setting="marginHorizontal" type="number" min="8" max="30" step="1"></label><label>公司间距<input data-setting="experienceGap" type="number" min="0" max="15" step="0.5"></label><label>部门/岗位间距<input data-setting="roleGap" type="number" min="0" max="10" step="0.25"></label><label>段落间距<input data-setting="experienceInner" type="number" min="0" max="6" step="0.25"></label></div><label>照片高度（mm）<input data-setting="photoHeight" type="number" min="8" max="65" step="any" placeholder="自动适应页头"></label><span class="unit-label">边距与间距单位：mm</span></aside>
<dialog id="rename-dialog"><form id="rename-form"><div class="dialog-heading"><h2>重命名简历</h2><button id="rename-close" type="button" aria-label="关闭">×</button></div><input id="rename-name" aria-label="简历名称" maxlength="80" required><button type="submit" class="primary">保存</button></form></dialog>
<dialog id="create-dialog"><form id="create-form"><div class="dialog-heading"><h2 id="create-title">使用模板</h2><button id="create-close" type="button" aria-label="关闭">×</button></div><label>简历名称<input id="resume-name" maxlength="80" placeholder="默认使用姓名，可自定义"></label><label>上传已有简历<input id="resume-file" type="file" accept=".pdf,.docx,.md,.txt,.json"></label><span class="small-hint">PDF、Word、Markdown；不上传则从模板开始</span><p id="bilingual-hint" class="small-hint" hidden>已有双语内容直接排版；单语转双语会发送至配置的翻译服务；未配置时可由宿主 agent 翻译。</p><button id="create-submit" class="primary" type="submit">确定</button></form></dialog>
<dialog id="link-dialog"><form id="link-form"><div class="dialog-heading"><h2>插入超链接</h2><button id="link-close" type="button" aria-label="关闭">×</button></div><label>显示文字<input id="link-text" required></label><label>链接地址<input id="link-url" placeholder="https://" required></label><button class="primary" type="submit">插入</button></form></dialog>
<dialog id="image-dialog"><form id="image-form"><div class="dialog-heading"><h2>插入图片</h2><button id="image-close" type="button" aria-label="关闭">×</button></div><select id="image-kind" aria-label="图片用途"><option value="photo">证件照 · 右上角</option><option value="logo">公司 / 学校logo</option><option value="qr">二维码</option></select><select id="image-position" aria-label="插入位置" hidden><option value="">左上角</option></select><label>图片<input id="image-file" type="file" accept="image/png,image/jpeg,image/webp" required></label><button class="primary" type="submit">插入</button></form></dialog>
<div id="sync-conflict" class="notice" hidden>有未同步的修改。<button id="draft-download">保存草稿</button><button id="sync-load">载入文件版本</button></div><div id="notice" class="notice" role="status" hidden></div>
<article id="resume" class="paper measurement-paper" aria-hidden="true"></article><style id="print-settings"></style>
</body></html>
